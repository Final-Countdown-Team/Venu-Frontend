version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
